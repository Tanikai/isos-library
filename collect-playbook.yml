---
- name: Collect benchmark results from replicas
  hosts: clients
  become: yes
  gather_facts: false

  vars:
    benchmark_remote_src_dir: /home/ubuntu/benchmark_out/
    benchmark_local_dst_dir: evaluation/data/

  tasks:
    - name: Synchronize remote benchmark directory to local machine
      synchronize:
        src: "{{ benchmark_remote_src_dir }}"
        dest: "{{ benchmark_local_dst_dir }}"
        recursive: yes
        delete: no
        mode: pull

    - name: Remove remote benchmark directory and contents
      file:
        path: "{{ benchmark_remote_src_dir }}"
        state: absent

    - name: Recreate empty remote benchmark directory
      file:
        path: "{{ benchmark_remote_src_dir }}"
        state: directory
        owner: ubuntu
        mode: '0755'
